name: Remove old releases

# One-off: removes the releases of the old numbering (v1.1 to v1.23, published
# before 19 October 2026 10:55 Paris time), so that versions start again at 1.0.
# Runs when this file changes, or by hand from the Actions tab.

on:
  push:
    branches: [ main ]
    paths: [ ".github/workflows/cleanup-releases.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases and tags published before the cut-off
        env:
          GH_TOKEN: ${{ github.token }}
          CUTOFF: "2026-10-19T08:55:00Z"
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.created_at < \"$CUTOFF\") | .tag_name" |
          while read -r tag; do
            echo "Suppression de $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
