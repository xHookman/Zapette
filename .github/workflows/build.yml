name: Build APK

# Every push on main publishes a GitHub Release "v1.<build number>" with the
# APK files (no zip). Zapette checks these releases to update itself.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      latest_addon:
        description: "Embarquer la dernière version de Catch-up TV & More (GitHub master)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy needs the same Python version on the build machine to install pip packages
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # The Android SDK is preinstalled on GitHub's Ubuntu runners (ANDROID_HOME)

      - uses: gradle/actions/setup-gradle@v4

      - name: Refresh bundled add-ons
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.latest_addon }}
        run: ./gradlew :app:updateAddons

      - name: Engine smoke test (desktop Python, real add-on)
        run: |
          python -m pip install "requests==2.31.0" six pytz tzdata tzlocal future pyqrcode htmlement
          mkdir -p /tmp/kodi/addons
          unzip -q app/src/main/assets/addons/plugin.video.catchuptvandmore.zip -d /tmp/kodi/addons/plugin.video.catchuptvandmore
          unzip -q app/src/main/assets/addons/script.module.codequick.zip -d /tmp/kodi/addons/script.module.codequick
          python tools/test_bridge.py /tmp/kodi

      # Optional private signing key (GitHub secrets). Without it, the key of the
      # repository (app/zapette-release.jks) is used.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ZAPETTE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/zapette.jks"
            echo "ZAPETTE_KEYSTORE=$RUNNER_TEMP/zapette.jks" >> "$GITHUB_ENV"
            echo "Clé privée utilisée"
          else
            echo "Clé du dépôt utilisée"
          fi

      - name: Build
        env:
          ZAPETTE_KEYSTORE_PASSWORD: ${{ secrets.ZAPETTE_KEYSTORE_PASSWORD }}
          ZAPETTE_KEY_ALIAS: ${{ secrets.ZAPETTE_KEY_ALIAS }}
          ZAPETTE_KEY_PASSWORD: ${{ secrets.ZAPETTE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleRelease 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          # Compiler errors as one annotation, readable without downloading the logs
          msg=$(grep -E "^e: |What went wrong|^> " build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build::${msg}"

      - name: Name the APK files
        run: |
          mkdir -p dist
          cd app/build/outputs/apk/release
          for f in app-*-release.apk; do
            abi="${f#app-}"; abi="${abi%-release.apk}"
            cp "$f" "$GITHUB_WORKSPACE/dist/zapette-1.${{ github.run_number }}-$abi.apk"
          done
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: Publish the release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Zapette 1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          body: |
            ${{ github.event.head_commit.message }}

            **Quel fichier ?** `arm64-v8a` pour la plupart des box Android TV (Chromecast Google TV, Shield, Freebox, Bouygues…), `universal` en cas de doute.
            Les versions suivantes s'installent directement depuis Zapette : Réglages → Mettre à jour Zapette.
          files: dist/*.apk
