name: Build APK

# Two branches:
#   main  every push publishes the next version (v1.0, v1.1…) as a GitHub
#         Release. Zapette checks these releases to update itself.
#   dev   tests: the APK is only kept as a build artifact (7 days),
#         nothing is published and the installed apps are not told.
#
# Releases are signed with the private Zapette key, kept in GitHub secrets:
#   ZAPETTE_KEYSTORE_B64, ZAPETTE_KEYSTORE_PASSWORD, ZAPETTE_KEY_ALIAS, ZAPETTE_KEY_PASSWORD
# Without them the build still runs (to check the code) but nothing is published.
# Actions are pinned to a commit: a moved tag cannot change what runs here.

on:
  push:
    branches: [ main, dev ]
    # A change of the documentation alone does not make a new version
    paths-ignore: [ "README.md", "LICENSE" ]
  pull_request:
  workflow_dispatch:
    inputs:
      latest_addon:
        description: "Embarquer la dernière version de Catch-up TV & More (GitHub master)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish the release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy needs the same Python version on the build machine to install pip packages
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      # The Android SDK is preinstalled on GitHub's Ubuntu runners (ANDROID_HOME)

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Refresh bundled add-ons
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.latest_addon }}
        run: ./gradlew :app:updateAddons

      - name: Engine smoke test (desktop Python, real add-on)
        run: |
          python -m pip install "requests==2.31.0" six pytz tzdata tzlocal future pyqrcode htmlement
          mkdir -p /tmp/kodi/addons
          unzip -q app/src/main/assets/addons/plugin.video.catchuptvandmore.zip -d /tmp/kodi/addons/plugin.video.catchuptvandmore
          unzip -q app/src/main/assets/addons/script.module.codequick.zip -d /tmp/kodi/addons/script.module.codequick
          python tools/test_bridge.py /tmp/kodi

      - name: Signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ZAPETTE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/zapette.jks"
            echo "ZAPETTE_KEYSTORE=$RUNNER_TEMP/zapette.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Signature::Secrets ZAPETTE_KEYSTORE_* absents : APK de test signés avec une clé jetable, aucune release publiée."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # Next version after the latest release (v1.4 → 1.5). A test build is named
      # after the version it prepares, "1.5-test.<build>"
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -z "$latest" ]; then next="1.0"; else next="1.$(( ${latest#v1.} + 1 ))"; fi
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then version="$next"; else version="$next-test.$GITHUB_RUN_NUMBER"; fi
          echo "ZAPETTE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Version $version"

      - name: Build
        env:
          ZAPETTE_KEYSTORE_PASSWORD: ${{ secrets.ZAPETTE_KEYSTORE_PASSWORD }}
          ZAPETTE_KEY_ALIAS: ${{ secrets.ZAPETTE_KEY_ALIAS }}
          ZAPETTE_KEY_PASSWORD: ${{ secrets.ZAPETTE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleRelease 2>&1 | tee build.log

      - name: Forget the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/zapette.jks"

      - name: Report build errors
        if: failure()
        run: |
          # Compiler errors as one annotation, readable without downloading the logs
          msg=$( { grep -E "^e: |ERROR:|Missing class" build.log; grep -A10 "What went wrong" build.log; } | head -150 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build::${msg}"

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/zapette-$ZAPETTE_VERSION.apk"
          ls -la dist

      - name: Keep the test APK (dev branch)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zapette-${{ env.ZAPETTE_VERSION }}
          path: dist/*.apk
          retention-days: 7

      # A tag left behind by a deleted release would point to old code
      - name: Free the version tag
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v$ZAPETTE_VERSION" 2>/dev/null || true

      - name: Publish the release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.key.outputs.signed == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ env.ZAPETTE_VERSION }}
          name: Zapette ${{ env.ZAPETTE_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          body: |
            Un seul APK, pour toutes les TV et box Android.
            Déjà installée ? Mise à jour depuis Zapette : Réglages → Mettre à jour Zapette.
          files: dist/*.apk
